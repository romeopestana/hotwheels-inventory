<style>
  :root{
    --bg:#0f1115; --card:#1a1d24; --card2:#20242c; --text:#eef0f4; --muted:#9aa3b2;
    --accent:#ff3b3b; --sth:#d9b54a; --sth-text:#3a2c00; --th:#c7cbd1; --th-text:#20242c;
    --mainline:#3a4150; --border:#2a2f3a; --good:#3ecf8e; --bad:#ff5d5d;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);padding-bottom:70px;}
  header{position:sticky;top:0;background:var(--bg);padding:14px 16px 10px;border-bottom:1px solid var(--border);z-index:10;}
  header h1{font-size:18px;margin:0 0 2px;}
  header .sub{font-size:12px;color:var(--muted);}
  .version-tag{font-size:11px;font-weight:600;color:var(--muted);background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:2px 7px;vertical-align:middle;margin-left:4px;}
  .tabs{display:flex;gap:8px;margin-top:10px;}
  .tab-btn{flex:1;padding:9px 4px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:13px;font-weight:600;}
  .tab-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  main{padding:14px 16px 20px;max-width:640px;margin:0 auto;}
  .screen{display:none;}
  .screen.active{display:block;}

  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;}
  input[type=text], input[type=search], select, textarea{
    width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);
    background:var(--card2);color:var(--text);font-size:15px;
  }
  textarea{resize:vertical;min-height:60px;}
  .row2{display:flex;gap:10px;}
  .row2>*{flex:1;}

  .capture-box{border:1px dashed var(--border);border-radius:12px;padding:12px;text-align:center;background:var(--card);}
  .capture-box img{max-width:100%;border-radius:8px;display:block;margin:8px auto 0;max-height:220px;object-fit:cover;}
  .btn{display:inline-block;padding:10px 16px;border-radius:10px;border:none;font-weight:700;font-size:14px;cursor:pointer;}
  .btn-primary{background:var(--accent);color:#fff;width:100%;padding:13px;font-size:15px;}
  .btn-secondary{background:var(--card2);color:var(--text);border:1px solid var(--border);}
  .btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border);}
  .btn-block{width:100%;}
  input[type=file]{display:none;}
  .status-line{font-size:12px;margin-top:8px;min-height:16px;}
  .status-ok{color:var(--good);}
  .status-bad{color:var(--bad);}

  .segmented{display:flex;gap:8px;}
  .seg-opt{flex:1;text-align:center;padding:10px 6px;border-radius:10px;border:2px solid var(--border);font-weight:700;font-size:13px;cursor:pointer;background:var(--card2);color:var(--muted);}
  .seg-opt.sel-MAINLINE.selected{border-color:var(--mainline);background:var(--mainline);color:#fff;}
  .seg-opt.sel-TH.selected{border-color:var(--th);background:var(--th);color:var(--th-text);}
  .seg-opt.sel-STH.selected{border-color:var(--sth);background:var(--sth);color:var(--sth-text);}

  .badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:800;letter-spacing:.02em;}
  .badge-MAINLINE{background:var(--mainline);color:#fff;}
  .badge-TH{background:var(--th);color:var(--th-text);}
  .badge-STH{background:var(--sth);color:var(--sth-text);}

  .filters{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;}
  .chip-row{display:flex;gap:6px;flex-wrap:wrap;}
  .chip{padding:7px 12px;border-radius:20px;border:1px solid var(--border);background:var(--card);font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;}
  .chip.active{background:var(--accent);border-color:var(--accent);color:#fff;}

  .counts{display:flex;gap:8px;margin-bottom:14px;}
  .count-box{flex:1;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px;text-align:center;}
  .count-box .num{font-size:20px;font-weight:800;}
  .count-box .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;}

  .item-card{display:flex;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px;margin-bottom:10px;cursor:pointer;}
  .item-card img{width:64px;height:64px;object-fit:cover;border-radius:8px;background:var(--card2);flex-shrink:0;}
  .item-card .noimg{width:64px;height:64px;border-radius:8px;background:var(--card2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--muted);}
  .item-info{flex:1;min-width:0;}
  .item-info .name{font-weight:700;font-size:15px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .item-info .meta{font-size:12px;color:var(--muted);margin-bottom:6px;}

  .empty{text-align:center;color:var(--muted);padding:40px 10px;font-size:14px;}

  .modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;align-items:flex-end;}
  .modal-bg.active{display:flex;}
  .modal{background:var(--card);width:100%;max-height:88vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:18px;}
  .modal img{width:100%;border-radius:10px;margin-bottom:12px;max-height:280px;object-fit:cover;}
  .modal-actions{display:flex;gap:10px;margin-top:16px;}
  .modal-actions .btn{flex:1;}

  .footer-actions{display:flex;gap:10px;margin-top:6px;}
  .footer-actions .btn{flex:1;}

  .scanner-bg{display:none;position:fixed;inset:0;background:#000;z-index:70;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:16px;}
  .scanner-bg.active{display:flex;}
  .scanner-target{width:100%;max-width:480px;aspect-ratio:4/3;position:relative;overflow:hidden;border-radius:12px;background:#111;}
  .scanner-target video, .scanner-target canvas{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;}
  .scanner-hint{color:var(--muted);font-size:13px;text-align:center;}
  #scannerCancelBtn{width:100%;max-width:480px;}
</style>
</head>

<!-- LIVE BARCODE SCANNER OVERLAY -->
<div class="scanner-bg" id="scannerBg">
  <div class="scanner-target" id="scannerTarget"></div>
  <div class="scanner-hint">Point your camera at the barcode</div>

</div>

<script>
// Bump this with every meaningful change so testers can confirm which version is loaded
// (shown in the header, and stamped into JSON backups).
const APP_VERSION = 'v1.4.1';
document.getElementById('versionTag').textContent = APP_VERSION;

const STORAGE_KEY = 'hwInventory_v1';
const WISH_STORAGE_KEY = 'hwWishlist_v1';
let items = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
let wishItems = JSON.parse(localStorage.getItem(WISH_STORAGE_KEY) || '[]');
let currentRarity = null;
let pendingPhoto = null;
let rarityFilter = 'ALL';
let editingId = null;
let wishPendingPhoto = null;
let wishEditingId = null;

// Stored photo dimensions -- kept small since every saved photo lives in localStorage on
// the phone. 520px / 0.68 quality keeps images clearly recognizable for a small collection
// card/thumbnail while using a fraction of the space of a full camera photo.
const PHOTO_MAX_DIM = 520;
const PHOTO_QUALITY = 0.68;

function switchTab(tab){
  if(tab !== 'add') stopBarcodeScanner(); // release the camera if we're navigating away mid-scan
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  document.getElementById('screen-add').classList.toggle('active', tab==='add');
  document.getElementById('screen-inv').classList.toggle('active', tab==='inv');
  document.getElementById('screen-wish').classList.toggle('active', tab==='wish');
  if(tab==='inv') renderInventory();
  if(tab==='wish') renderWishlist();
}

// Modern phone cameras shoot very large photos (12-100+ MP). Decoding the full-resolution
// image into memory before shrinking it (e.g. via FileReader -> base64 -> <img>) can exceed a
// mobile browser tab's memory budget and crash the page. To avoid that we prefer
// createImageBitmap() with resize options, which lets the browser downscale *during* decode
// instead of ever materializing the full-size bitmap. We fall back to an object-URL + <img>
// approach (still cheaper than base64) only if createImageBitmap isn't available.
async function resizeImage(file, maxDim, quality){
  const MAX_INPUT_BYTES = 30 * 1024 * 1024; // sanity cap, just in case
  if(file.size > MAX_INPUT_BYTES){
    throw new Error('That photo is very large (' + Math.round(file.size/1024/1024) + 'MB). Try again, or lower your camera resolution in phone settings.');
  }

  if(typeof createImageBitmap === 'function'){
    try{
      const bitmap = await createImageBitmap(file, { resizeWidth: maxDim, resizeQuality: 'medium' });
      // Some browsers accept resize options without error but ignore them and return the
      // full-resolution bitmap anyway. Never trust bitmap.width/height blindly -- always
      // compute the target size ourselves and draw scaled down onto a small canvas, so the
      // canvas (and the resulting encoded image) never balloon to full camera resolution.
      let w = bitmap.width, h = bitmap.height;
      if(w>h && w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; }
      else if(h>=w && h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      canvas.getContext('2d').drawImage(bitmap, 0, 0, w, h);
      if(bitmap.close) bitmap.close();
      return canvas.toDataURL('image/jpeg', quality);
    }catch(e){
      // fall through to the fallback path below (some browsers reject resize options entirely)
    }
  }

  return new Promise((resolve,reject)=>{
    const objUrl = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      let w=img.naturalWidth, h=img.naturalHeight;
      if(w>h && w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; }
      else if(h>=w && h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      URL.revokeObjectURL(objUrl);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = (e) => { URL.revokeObjectURL(objUrl); reject(new Error('Could not read that photo. Please try again.')); };
    img.src = objUrl;
  });
}

function handlePhoto(event){
  const file = event.target.files[0];
  if(!file) return;
  const statusEl = document.getElementById('saveStatus');
  statusEl.textContent = 'Processing photo...';
  statusEl.className = 'status-line';
  resizeImage(file, PHOTO_MAX_DIM, PHOTO_QUALITY).then(dataUrl=>{
    pendingPhoto = dataUrl;
    const img = document.getElementById('carPhotoPreview');
    img.src = dataUrl;
    img.style.display='block';
    statusEl.textContent = '';
  }).catch(err=>{
    statusEl.textContent = err.message || 'Could not process that photo. Please try again.';
    statusEl.className = 'status-line status-bad';
    event.target.value = '';
  });
}

function handleWishPhoto(event){
  const file = event.target.files[0];
  if(!file) return;
  const statusEl = document.getElementById('wishSaveStatus');
  statusEl.textContent = 'Processing photo...';
  statusEl.className = 'status-line';
  resizeImage(file, PHOTO_MAX_DIM, PHOTO_QUALITY).then(dataUrl=>{
    wishPendingPhoto = dataUrl;
    const img = document.getElementById('wishPhotoPreview');
    img.src = dataUrl;
    img.style.display='block';
    statusEl.textContent = '';
  }).catch(err=>{
    statusEl.textContent = err.message || 'Could not process that photo. Please try again.';
    statusEl.className = 'status-line status-bad';
    event.target.value = '';
  });
}

// Barcode scanning uses a LIVE camera stream (Quagga's LiveStream mode) instead of capturing
// a full still photo and decoding it. This was previously done by asking the phone's camera
// app for a photo (often 12-100+ MP) and decoding that whole image -- doing this right after
// already decoding a full-res car photo could push some phones (Android and iPhone alike)
// over their available memory and crash with a "low memory" error. A live video stream only
// ever processes small, fixed-resolution frames, so no full-resolution image is ever decoded.
// This requires a secure context (https), which the hosted version of this app satisfies.
let scannerRunning = false;

// Quagga fires onDetected for every single frame it manages to decode, with zero confirmation
// -- pointed anywhere near text or other numbers, it will happily lock onto a false read in a
// fraction of a second. We require the SAME code to be read several frames in a row before
// accepting it (a standard debounce technique for live barcode scanning), which filters out
// one-off misreads without meaningfully slowing down a genuine, steady scan.
const SCAN_CONFIRM_COUNT = 4;
let scanBuffer = { code: null, count: 0 };

function startBarcodeScanner(){
  const statusEl = document.getElementById('barcodeStatus');
  statusEl.textContent = '';
  statusEl.className = 'status-line';
  scanBuffer = { code: null, count: 0 };

  if(typeof Quagga === 'undefined'){
    statusEl.textContent = 'Barcode scanner failed to load — enter UPC manually below.';
    statusEl.className = 'status-line status-bad';
    return;
  }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    statusEl.textContent = 'Camera not available on this browser — enter UPC manually below.';
    statusEl.className = 'status-line status-bad';
    return;
  }

  const target = document.getElementById('scannerTarget');
  target.innerHTML = '';
  document.getElementById('scannerBg').classList.add('active');

  Quagga.init({
    inputStream: {
      name: 'Live',
      type: 'LiveStream',
      target: target,
      constraints: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } }
    },
    // Narrowed to the formats actually used on retail packaging (UPC-A / EAN-13, plus the
    // shorter UPC-E / EAN-8 variants). code_128_reader was dropped -- it's a general-purpose
    // symbology unrelated to retail barcodes and was a common source of false-positive reads
    // on background text/patterns.
    decoder: { readers: ['upc_reader','ean_reader','ean_8_reader','upc_e_reader'] },
    locate: true
  }, function(err){
    if(err){
      console.error(err);
      document.getElementById('scannerBg').classList.remove('active');
      statusEl.textContent = 'Could not access camera — enter UPC manually below.';
      statusEl.className = 'status-line status-bad';
      return;
    }
    scannerRunning = true;
    Quagga.onDetected(onBarcodeDetected);
    Quagga.start();
  });
}

function onBarcodeDetected(result){
  if(!result || !result.codeResult || !result.codeResult.code) return;
  const code = result.codeResult.code;
  const statusEl = document.getElementById('barcodeStatus');

  if(code === scanBuffer.code){
    scanBuffer.count++;
  } else {
    scanBuffer = { code: code, count: 1 };
  }

  if(scanBuffer.count < SCAN_CONFIRM_COUNT){
    statusEl.textContent = 'Reading... hold steady (' + scanBuffer.count + '/' + SCAN_CONFIRM_COUNT + ')';
    statusEl.className = 'status-line';
    return;
  }

  document.getElementById('upcField').value = code;
  statusEl.textContent = '✓ Detected: ' + code;
  statusEl.className = 'status-line status-ok';
  stopBarcodeScanner();
}

function stopBarcodeScanner(){
  if(scannerRunning){
    try{ Quagga.offDetected(onBarcodeDetected); }catch(e){}
    try{ Quagga.stop(); }catch(e){}
    scannerRunning = false;
  }
  scanBuffer = { code: null, count: 0 };
  document.getElementById('scannerBg').classList.remove('active');
}

function selectRarity(val){
  currentRarity = val;
  document.querySelectorAll('.seg-opt').forEach(el=>{
    el.classList.toggle('selected', el.dataset.val===val);
  });
}

function resetForm(){
  stopBarcodeScanner();
  pendingPhoto = null; currentRarity = null; editingId = null;
  document.getElementById('carPhotoPreview').style.display='none';
  document.getElementById('carPhotoInput').value='';
  document.getElementById('barcodeStatus').textContent='';
  document.getElementById('upcField').value='';
  document.getElementById('castingField').value='';
  document.getElementById('mfrField').value='';
  document.getElementById('seriesField').value='';
  document.getElementById('notesField').value='';
  document.querySelectorAll('.seg-opt').forEach(el=>el.classList.remove('selected'));
  document.getElementById('saveBtn').textContent='Save to Inventory';
  document.getElementById('saveStatus').textContent='';
}

function saveItem(){
  const statusEl = document.getElementById('saveStatus');
  if(!pendingPhoto){
    statusEl.textContent = 'Please add a photo of the car.';
    statusEl.className = 'status-line status-bad';
    return;
  }
  if(!currentRarity){
    statusEl.textContent = 'Please select a rarity tag (Mainline / TH / Super TH).';
    statusEl.className = 'status-line status-bad';
    return;
  }
  const item = {
    id: editingId || (Date.now() + '-' + Math.random().toString(36).slice(2,7)),
    photo: pendingPhoto,
    upc: document.getElementById('upcField').value.trim(),
    casting_name: document.getElementById('castingField').value.trim(),
    manufacturer_line: document.getElementById('mfrField').value.trim() || 'Mainline',
    series_name: document.getElementById('seriesField').value.trim(),
    rarity_tag: currentRarity,
    notes: document.getElementById('notesField').value.trim(),
    date_added: editingId ? (items.find(i=>i.id===editingId)||{}).date_added || new Date().toISOString() : new Date().toISOString()
  };
  if(editingId){
    items = items.map(i=> i.id===editingId ? item : i);
  } else {
    items.unshift(item);
  }
  localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
  statusEl.textContent = '✓ Saved!';
  statusEl.className = 'status-line status-ok';
  setTimeout(()=>{ resetForm(); switchTab('inv'); }, 400);
}

function setRarityFilter(val){
  rarityFilter = val;
  document.querySelectorAll('#rarityChips .chip').forEach(c=>c.classList.toggle('active', c.dataset.val===val));
  renderInventory();
}

function populateMfrFilter(){
  const sel = document.getElementById('mfrFilter');
  const current = sel.value;
  const mfrs = Array.from(new Set(items.map(i=>i.manufacturer_line).filter(Boolean))).sort();
  sel.innerHTML = '<option value="ALL">All manufacturers</option>' + mfrs.map(m=>`<option value="${escapeHtml(m)}">${escapeHtml(m)}</option>`).join('');
  if(mfrs.includes(current)) sel.value = current;
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderInventory(){
  populateMfrFilter();
  const search = document.getElementById('searchField').value.trim().toLowerCase();
  const mfrFilter = document.getElementById('mfrFilter').value;

  document.getElementById('cntAll').textContent = items.length;
  document.getElementById('cntTH').textContent = items.filter(i=>i.rarity_tag==='TH').length;
  document.getElementById('cntSTH').textContent = items.filter(i=>i.rarity_tag==='STH').length;

  let filtered = items;
  if(rarityFilter !== 'ALL') filtered = filtered.filter(i=>i.rarity_tag===rarityFilter);
  if(mfrFilter !== 'ALL') filtered = filtered.filter(i=>i.manufacturer_line===mfrFilter);
  if(search) filtered = filtered.filter(i=> (i.casting_name||'').toLowerCase().includes(search));

  const listEl = document.getElementById('itemList');
  if(filtered.length===0){
    listEl.innerHTML = '<div class="empty">No cars match yet. Add one from the + Add Car tab.</div>';
    return;
  }
  listEl.innerHTML = filtered.map(i=>`
    <div class="item-card" onclick="openModal('${i.id}')">
      ${i.photo ? `<img src="${i.photo}">` : `<div class="noimg">🚗</div>`}
      <div class="item-info">
        <div class="name">${escapeHtml(i.casting_name || 'Unnamed casting')}</div>
        <div class="meta">${escapeHtml(i.manufacturer_line || '—')}${i.series_name ? ' · ' + escapeHtml(i.series_name) : ''}</div>
        <span class="badge badge-${i.rarity_tag}">${i.rarity_tag === 'STH' ? 'SUPER TH' : i.rarity_tag}</span>
      </div>
    </div>
  `).join('');
}

function openModal(id){
  const item = items.find(i=>i.id===id);
  if(!item) return;
  const body = document.getElementById('modalBody');
  body.innerHTML = `
    ${item.photo ? `<img src="${item.photo}">` : ''}
    <span class="badge badge-${item.rarity_tag}">${item.rarity_tag === 'STH' ? 'SUPER TH' : item.rarity_tag}</span>
    <h2 style="margin:10px 0 4px;">${escapeHtml(item.casting_name || 'Unnamed casting')}</h2>
    <div style="color:var(--muted);font-size:13px;margin-bottom:10px;">
      ${escapeHtml(item.manufacturer_line || '—')}${item.series_name ? ' · ' + escapeHtml(item.series_name) : ''}
    </div>
    <div style="font-size:13px;color:var(--muted);margin-bottom:4px;">UPC: ${escapeHtml(item.upc || '—')}</div>
    ${item.notes ? `<div style="font-size:14px;margin-top:8px;white-space:pre-wrap;">${escapeHtml(item.notes)}</div>` : ''}
    <div style="font-size:11px;color:var(--muted);margin-top:12px;">Added ${new Date(item.date_added).toLocaleDateString()}</div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="editItem('${item.id}')">Edit</button>
      <button class="btn btn-ghost" style="color:var(--bad);border-color:var(--bad);" onclick="deleteItem('${item.id}')">Delete</button>
    </div>
  `;
  document.getElementById('modalBg').classList.add('active');
}

function closeModal(){
  document.getElementById('modalBg').classList.remove('active');
}

function editItem(id){
  const item = items.find(i=>i.id===id);
  if(!item) return;
  closeModal();
  switchTab('add');
  editingId = id;
  pendingPhoto = item.photo;
  currentRarity = item.rarity_tag;
  document.getElementById('carPhotoPreview').src = item.photo;
  document.getElementById('carPhotoPreview').style.display='block';
  document.getElementById('upcField').value = item.upc || '';
  document.getElementById('castingField').value = item.casting_name || '';
  document.getElementById('mfrField').value = item.manufacturer_line || '';
  document.getElementById('seriesField').value = item.series_name || '';
  document.getElementById('notesField').value = item.notes || '';
  document.querySelectorAll('.seg-opt').forEach(el=>el.classList.toggle('selected', el.dataset.val===item.rarity_tag));
  document.getElementById('saveBtn').textContent='Update Car';
}

function deleteItem(id){
  if(!confirm('Delete this car from your inventory?')) return;
  items = items.filter(i=>i.id!==id);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
  closeModal();
  renderInventory();
}

function resetWishForm(){
  wishPendingPhoto = null; wishEditingId = null;
  document.getElementById('wishPhotoPreview').style.display='none';
  document.getElementById('wishPhotoInput').value='';
  document.getElementById('wishNameField').value='';
  document.getElementById('wishSeriesField').value='';
  document.getElementById('wishColourField').value='';
  document.getElementById('wishNotesField').value='';
  document.getElementById('wishSaveBtn').textContent='Add to Wishlist';
  document.getElementById('wishSaveStatus').textContent='';
}

function saveWishItem(){
  const statusEl = document.getElementById('wishSaveStatus');
  const name = document.getElementById('wishNameField').value.trim();
  if(!name){
    statusEl.textContent = 'Please enter a car name.';
    statusEl.className = 'status-line status-bad';
    return;
  }
  const wishItem = {
    id: wishEditingId || (Date.now() + '-' + Math.random().toString(36).slice(2,7)),
    photo: wishPendingPhoto,
    car_name: name,
    series_name: document.getElementById('wishSeriesField').value.trim(),
    colour: document.getElementById('wishColourField').value.trim(),
    notes: document.getElementById('wishNotesField').value.trim(),
    date_added: wishEditingId ? (wishItems.find(i=>i.id===wishEditingId)||{}).date_added || new Date().toISOString() : new Date().toISOString()
  };
  if(wishEditingId){
    wishItems = wishItems.map(i=> i.id===wishEditingId ? wishItem : i);
  } else {
    wishItems.unshift(wishItem);
  }
  localStorage.setItem(WISH_STORAGE_KEY, JSON.stringify(wishItems));
  statusEl.textContent = '✓ Added!';
  statusEl.className = 'status-line status-ok';
  setTimeout(()=>{ resetWishForm(); renderWishlist(); }, 400);
}

function renderWishlist(){
  document.getElementById('cntWish').textContent = wishItems.length;
  const listEl = document.getElementById('wishList');
  if(wishItems.length===0){
    listEl.innerHTML = '<div class="empty">Nothing on your wishlist yet. Add a car you\'re hunting for above.</div>';
    return;
  }
  listEl.innerHTML = wishItems.map(i=>`
    <div class="item-card" onclick="openWishModal('${i.id}')">
      ${i.photo ? `<img src="${i.photo}">` : `<div class="noimg">🔍</div>`}
      <div class="item-info">
        <div class="name">${escapeHtml(i.car_name)}</div>
        <div class="meta">${escapeHtml(i.series_name || '—')}${i.colour ? ' · ' + escapeHtml(i.colour) : ''}</div>
      </div>
    </div>
  `).join('');
}

function openWishModal(id){
  const item = wishItems.find(i=>i.id===id);
  if(!item) return;
  const body = document.getElementById('modalBody');
  body.innerHTML = `
    ${item.photo ? `<img src="${item.photo}">` : ''}
    <h2 style="margin:10px 0 4px;">${escapeHtml(item.car_name)}</h2>
    <div style="color:var(--muted);font-size:13px;margin-bottom:10px;">
      ${escapeHtml(item.series_name || '—')}${item.colour ? ' · ' + escapeHtml(item.colour) : ''}
    </div>
    ${item.notes ? `<div style="font-size:14px;margin-top:8px;white-space:pre-wrap;">${escapeHtml(item.notes)}</div>` : ''}
    <div style="font-size:11px;color:var(--muted);margin-top:12px;">Added ${new Date(item.date_added).toLocaleDateString()}</div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="editWishItem('${item.id}')">Edit</button>
      <button class="btn btn-ghost" style="color:var(--bad);border-color:var(--bad);" onclick="deleteWishItem('${item.id}')">Delete</button>
    </div>
    <button class="btn btn-primary" style="width:100%;margin-top:10px;" onclick="moveWishToInventory('${item.id}')">Found it! Add to Inventory →</button>
  `;
  document.getElementById('modalBg').classList.add('active');
}

function editWishItem(id){
  const item = wishItems.find(i=>i.id===id);
  if(!item) return;
  closeModal();
  switchTab('wish');
  wishEditingId = id;
  wishPendingPhoto = item.photo;
  if(item.photo){
    document.getElementById('wishPhotoPreview').src = item.photo;
    document.getElementById('wishPhotoPreview').style.display='block';
  }
  document.getElementById('wishNameField').value = item.car_name || '';
  document.getElementById('wishSeriesField').value = item.series_name || '';
  document.getElementById('wishColourField').value = item.colour || '';
  document.getElementById('wishNotesField').value = item.notes || '';
  document.getElementById('wishSaveBtn').textContent='Update Wishlist Item';
}

function deleteWishItem(id){
  if(!confirm('Remove this car from your wishlist?')) return;
  wishItems = wishItems.filter(i=>i.id!==id);
  localStorage.setItem(WISH_STORAGE_KEY, JSON.stringify(wishItems));
  closeModal();
  renderWishlist();
}

// Bridge: prefill the Add Car form from a wishlist entry once the collector has actually
// found/bought it. The wishlist entry is left in place (not auto-deleted) so nothing is lost
// if the user backs out of saving -- they can delete it manually from the wishlist afterward.
function moveWishToInventory(id){
  const item = wishItems.find(i=>i.id===id);
  if(!item) return;
  closeModal();
  switchTab('add');
  resetForm();
  pendingPhoto = item.photo;
  if(item.photo){
    document.getElementById('carPhotoPreview').src = item.photo;
    document.getElementById('carPhotoPreview').style.display='block';
  }
  document.getElementById('castingField').value = item.car_name || '';
  document.getElementById('seriesField').value = item.series_name || '';
  const notesParts = [];
  if(item.colour) notesParts.push('Colour: ' + item.colour);
  if(item.notes) notesParts.push(item.notes);
  document.getElementById('notesField').value = notesParts.join(' — ');
}

function exportData(){
  const payload = { app_version: APP_VERSION, inventory: items, wishlist: wishItems };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'hotwheels_inventory_backup_' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importData(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const parsed = JSON.parse(e.target.result);
      // Support both the current {inventory, wishlist} export format and the older
      // plain-array format (inventory only) from before the Wishlist tab existed.
      const importedInventory = Array.isArray(parsed) ? parsed : (Array.isArray(parsed.inventory) ? parsed.inventory : null);
      const importedWishlist = Array.isArray(parsed) ? [] : (Array.isArray(parsed.wishlist) ? parsed.wishlist : []);
      if(!importedInventory) throw new Error('bad format');
      const replace = confirm('Replace current inventory & wishlist with imported file? Cancel to merge instead.');
      if(replace){
        items = importedInventory;
        wishItems = importedWishlist;
      } else {
        const existingIds = new Set(items.map(i=>i.id));
        importedInventory.forEach(i=>{ if(!existingIds.has(i.id)) items.push(i); });
        const existingWishIds = new Set(wishItems.map(i=>i.id));
        importedWishlist.forEach(i=>{ if(!existingWishIds.has(i.id)) wishItems.push(i); });
      }
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
      localStorage.setItem(WISH_STORAGE_KEY, JSON.stringify(wishItems));
      renderInventory();
      renderWishlist();
      alert('Import complete. ' + items.length + ' cars in inventory, ' + wishItems.length + ' on wishlist.');
    }catch(err){
      alert('Could not read that file as a valid inventory export.');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

renderInventory();
renderWishlist();
</script>
</body>
</html>
